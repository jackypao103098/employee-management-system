version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend/react && npm ci
    build:
      commands:
        - cd frontend/react && npm run build
  artifacts:
    baseDirectory: frontend/react/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/react/node_modules/**/*
  customRules:
    - source: </^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|ttf|map|json)$)([^.]+$)/>
      target: /index.html
      status: '200'