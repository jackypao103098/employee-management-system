version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend/react
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend/react/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/react/node_modules/**/*
  customRules:
    - source: /api/v1/<*>
      target: https://d16m8xa74z2ftt.cloudfront.net/api/v1/<*>
      status: '200'
    - source: </^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|ttf|map|json)$)([^.]+$)/>
      target: /index.html
      status: '200'